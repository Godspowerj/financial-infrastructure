# Air config for payments service hot-reloading.
# Run `air` from services/payments/ to auto-restart on code changes.

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api.exe ./cmd/api"
  bin = "tmp\\api.exe"
  delay = 1000
  exclude_dir = ["tmp", "vendor"]
  exclude_regex = ["_test\\.go"]
  include_ext = ["go"]
  kill_delay = "1s"

[log]
  time = true

[misc]
  clean_on_exit = true
